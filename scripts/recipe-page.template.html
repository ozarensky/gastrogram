<title>{{TITLE}}</title>
{{HEAD}}
<style>
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px 8px; }
  h1 {
    margin: 14px 0 8px;
    font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1.02; letter-spacing: .01em;
    text-wrap: balance;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 18px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--ink); font-weight: 700; }
  .plan-note { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); }
  h2.section-title { font-size: 18px; margin-top: 26px; }
  .ings { list-style: none; margin: 0; padding: 0; }
  .ings li { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .iqty { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .staples-only { margin: 10px 0 0; color: var(--ink-2); }
  .steps { list-style: none; margin: 12px 0 0; padding: 0; counter-reset: step; display: grid; gap: 14px; }
  .steps li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; line-height: 1.4; }
  .steps li::before {
    counter-increment: step; content: counter(step);
    font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink-2); padding-top: 2px;
  }
</style>

<div class="wrap">
  <header class="top">
    <a class="chip" href="{{SITE}}/shop/">Shopping list</a>
    <div class="controls">
      <button type="button" class="chip" id="theme" aria-label="Switch to the light theme">Light</button>
      <button type="button" class="chip" id="wake" aria-pressed="false" hidden>Keep screen on</button>
    </div>
  </header>

  <div class="eyebrow">{{WHEN}}</div>
  <h1>{{TITLE}}</h1>
  <p class="meta"><span><b>{{TOTAL_MIN}}</b> min total</span><span><b>{{ACTIVE_MIN}}</b> min hands-on</span><span>{{SERVES}}</span><span>{{CUISINE}}</span></p>
{{PLAN_NOTE}}
  <p class="toddler"><strong>Toddlers</strong>{{TODDLER}}</p>

  <h2 class="section-title"><span>Ingredients</span><span class="left">{{ING_COUNT}}</span></h2>
{{INGREDIENTS}}

  <h2 class="section-title"><span>Method</span><span class="left">{{STEP_COUNT}} steps</span></h2>
  <ol class="steps">
{{STEPS}}
  </ol>
</div>

<script>
{{CONTROLS_JS}}
</script>
